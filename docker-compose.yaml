services:
  pg:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: taskboard
    volumes:
      - pg_data:/var/lib/postgresql/data
      # SQL init script to run on first startup:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskboard-network

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_HOST: pg
      DB_PORT: "5432"
      DB_NAME: taskboard
      DB_USER: taskboard
      DB_PASSWORD: changeme
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - taskboard-network

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - taskboard-network

volumes:
  pg_data:

networks:
  taskboard-network:
    driver: bridge