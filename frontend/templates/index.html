<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1rem; }
    input[type=text] { flex: 1; padding: .5rem; }
    button { padding: .5rem .8rem; cursor: pointer; }
    li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid #ddd; }
    li span { flex: 1; cursor: pointer; }
    li.done span { text-decoration: line-through; color: #888; }
    ul { list-style: none; padding: 0; }
    #err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Taskboard</h1>
  <p id="err"></p>
  <form id="f">
    <input id="title" type="text" placeholder="New task" required>
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
